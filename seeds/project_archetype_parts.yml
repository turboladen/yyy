- id: 22
  description: PNP Germanium Transistor
  project_ids: [2]
  category_id: 21
  reference_designators: [Q2, Q3]
  amount_needed:
    value: 2
    unit: pieces
  is_required: true
  notes: >
    - Original Fuzz Face used AC128, replaced by Newmarket NKT275 before
      switching to silicon.
    - Reasonable high-gain (HFE > 60) and super-low leakage current.
    - Site suggests NOS Russian transistors.
    - Best = low gain in first stage (HFE ~= 80) and high gain in second
      (HFE ~= 120).

